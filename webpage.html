<!DOCTYPE html>
<html>
    <head>
        <title>
            BIM Calculator
        </title>
        <meta name = "viewport" content="width = device-width, initial-scale = 1.0">
        <link rel="stylesheet" href="wstyle.css">
    </head>
    <body>
        
        <div class="heading">
            <h1>BMI Calculator</h1>
        </div>

        <div class="form">
            <form id="bmiform">
                <label>Weight (kg)</label><input type="number" min="1" placeholder="e . g . 70" id="weight"><br>
                <label>Height (cm)</label><input type="number" min="1" placeholder="e. g. 170" id="height"><br>
                <button id="mybutton">Calculate BMI</button>
            </form>
        </div>

        <div id="result"></div>
        <script src="script.js"></script>

    </body>
</html>
